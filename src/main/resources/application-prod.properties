# Production Environment Configuration
# Use this profile for production deployment with environment variables

# Database Configuration - Use environment variables for security
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/musicapi}
spring.datasource.username=${DATABASE_USERNAME:musicapi}
spring.datasource.password=${DATABASE_PASSWORD:musicapi}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Configuration for Production
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Production Logging Configuration
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.rockstars.musicapi=INFO
logging.level.org.springframework=WARN
logging.level.root=INFO

# Security and Performance Settings
server.error.include-stacktrace=never
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Application Settings
spring.jpa.open-in-view=false