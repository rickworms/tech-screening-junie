# Test Environment Configuration
# Use this profile for tests with PostgreSQL via Testcontainers

# PostgreSQL Database Configuration for Tests
# These values will be overridden by Testcontainers dynamic configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=test
spring.datasource.password=test

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable connection pool for tests
spring.datasource.hikari.maximum-pool-size=1

# Reduce logging noise in tests
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot.autoconfigure=WARN

# Test-specific configurations
spring.jpa.defer-datasource-initialization=true
